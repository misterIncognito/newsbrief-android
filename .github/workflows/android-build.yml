name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Configure integration APK signing
        if: github.ref == 'refs/heads/integration/isolated-feed' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          CI_KEYSTORE: ${{ secrets.NEWSBRIEF_CI_KEYSTORE }}
          CI_PASSWORD: ${{ secrets.NEWSBRIEF_CI_PASSWORD }}
        run: |
          if [[ -z "$CI_KEYSTORE" || -z "$CI_PASSWORD" ]]; then
            echo '::error::NewsBrief integration signing secrets are not configured.'
            exit 1
          fi
          umask 077
          printf '%s' "$CI_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/newsbrief-ci.p12"
          printf 'NEWSBRIEF_SIGNING_KEYSTORE=%s\n' "$RUNNER_TEMP/newsbrief-ci.p12" >> "$GITHUB_ENV"

      - name: Run tests and build
        env:
          NEWSBRIEF_SIGNING_PASSWORD: ${{ github.ref == 'refs/heads/integration/isolated-feed' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && secrets.NEWSBRIEF_CI_PASSWORD || '' }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug verifyModuleInterfaces --no-daemon --max-workers=2

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: newsbrief-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish integration prerelease
    if: github.ref == 'refs/heads/integration/isolated-feed' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v8
        with:
          name: newsbrief-debug-apk
          path: apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-debug.apk newsbrief-alfa.apk
          tag="v0.0.${GITHUB_RUN_NUMBER}-alfa.${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" newsbrief-alfa.apk \
            --target "$GITHUB_SHA" \
            --title "Alfa 0.0.${GITHUB_RUN_NUMBER}" \
            --notes "Automated integration build for commit ${GITHUB_SHA}. This is a debug-signed Alfa build." \
            --prerelease --latest=false
